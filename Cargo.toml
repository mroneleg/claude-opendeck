[package]
name = "claude-opendeck"
version = "1.1.0"
edition = "2024"
description = "Claude Code Command Deck: an OpenDeck / Stream Deck plugin for Claude plan usage, pace and alerts, plus Claude Code session status"
license = "MIT"
authors = ["Mr. One Leg"]
repository = "https://github.com/mroneleg/claude-opendeck"
readme = "README.md"
publish = false

[[bin]]
name = "claude-opendeck"
path = "src/main.rs"

# Dev tool: rasterises the manifest icons with resvg (the renderer OpenDeck
# uses). Feature-gated so the plugin binary never links resvg.
[[bin]]
name = "build-icons"
path = "src/bin/build_icons.rs"
required-features = ["icons"]

[features]
default = ["http"]
# The HTTPS client (rustls + ring). Only disabled to type-check other targets
# from Linux, where ring's C code can't be cross-compiled without their SDKs.
http = ["dep:ureq"]
icons = ["dep:resvg"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
log = "0.4"
openaction = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simplelog = "0.12"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "process"] }
ureq = { version = "3", features = ["json"], optional = true }
resvg = { version = "0.47", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

# The sysinfo code path is also unit-tested on Linux.
[target.'cfg(target_os = "linux")'.dev-dependencies]
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

[target.'cfg(target_os = "windows")'.dependencies]
notify-rust = "4"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
