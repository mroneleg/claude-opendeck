name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: .exe
          - target: x86_64-apple-darwin
            os: macos-latest
            ext: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ""
          # Oldest supported Ubuntu runners, so the binaries need only an old glibc.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            ext: ""
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            ext: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Rename binary
        shell: bash
        run: |
          mkdir -p out
          cp "target/${{ matrix.target }}/release/claude-opendeck${{ matrix.ext }}" "out/claude-opendeck-${{ matrix.target }}${{ matrix.ext }}"
      - uses: actions/upload-artifact@v4
        with:
          name: claude-opendeck-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  package:
    name: Package and release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist/bin
          pattern: claude-opendeck-*
          merge-multiple: true
      - run: ls -l dist/bin
      - run: scripts/package.sh dist/bin
      - uses: actions/upload-artifact@v4
        with:
          name: com.mroneleg.claudeusage.streamDeckPlugin
          path: dist/com.mroneleg.claudeusage.streamDeckPlugin
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/com.mroneleg.claudeusage.streamDeckPlugin \
            --title "${GITHUB_REF_NAME}" --generate-notes
